<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Manutenção — Warzone Metas</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link href='fonts.css' rel='stylesheet'>
    <style>
        body {
            background-color: #0b0e13;
            color: #c9d1d9;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-image: radial-gradient(circle at center, #111827 0%, #030508 100%);
        }

        .maintenance-container {
            max-width: 600px;
            padding: 40px;
            background: rgba(16, 20, 26, 0.6);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 210, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 56px;
            color: #fff;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        h1 span {
            background: linear-gradient(135deg, #00d2ff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #8b949e;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .icon-gear {
            font-size: 64px;
            margin-bottom: 20px;
            display: inline-block;
            animation: spin 6s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .footer-note {
            font-size: 14px;
            color: #555c66;
            margin-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="icon-gear">⚙️</div>
        <h1>SITE EM <span>MANUTENÇÃO</span></h1>
        <p>Estamos trabalhando offline para corrigir todos os erros e aprimorar a plataforma. O <b>Warzone Metas</b> retornará em breve com um sistema totalmente refeito e 100% estável.</p>
        <p>Agradecemos a paciência de todos os usuários e criadores!</p>
        
        <div class="footer-note">
            Warzone Metas &copy; 2026. Voltaremos mais fortes!
        </div>
    </div>
</body>
</html>
