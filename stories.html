<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Forçar limpeza de cache do HTML em celulares -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Download Cards - GEREFPS</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="auth.js?v=3"></script>
</head>
<body class="admin-page">
    <div class="stories-page-header">
        <h1>📸 Download de Cards para Stories</h1>
        <p>Clique em "Baixar JPG" para salvar cada card no formato ideal para Instagram Stories (1080x1920).</p>
        <a href="admin.html" class="btn" style="width:auto; display:inline-block; margin-top:10px; padding: 10px 25px; font-size:0.85rem;">← Voltar ao Painel</a>
    </div>

    <div id="cardsGrid" class="stories-grid">
        <!-- Cards renderizados via JS -->
    </div>

    <!-- Template invisível usado para gerar a imagem em alta resolução -->
    <div id="renderZone" style="position:absolute; left:-9999px; top:0;"></div>

    <script src="stories.js?v=1720"></script>
</body>
</html>
