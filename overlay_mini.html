<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Overlay Minimalista (Webcam) - GEREFPS</title>
    <link href='fonts.css' rel='stylesheet'>
    <style>
        :root {
            --neon-blue: #00d2ff;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: transparent;
        }

        /* O container agora é uma BARRINHA HORIZONTAL */
        .mini-overlay-wrapper {
            background: rgba(5, 12, 25, 0.85);
            border: 2px solid var(--neon-blue);
            border-radius: 0px; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 210, 255, 0.1);
            
            width: 100vw; 
            height: 60px; /* Mesma altura da outra barrinha */
            padding: 0 20px;
            box-sizing: border-box;
            
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            
            opacity: 0; 
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .mini-overlay-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
            animation: glitch-in 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes glitch-in {
            0% { opacity: 0; transform: translateY(20px) scale(0.95) skewX(5deg); }
            40% { opacity: 1; transform: translateY(-2px) scale(1.02) skewX(-5deg); }
            100% { transform: translateY(0) scale(1) skewX(0); }
        }

        /* Fundo com blur no overlay OBS */
        .mini-overlay-wrapper::before {
            content: '';
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            background: url('fundo_app.jpg') center/cover no-repeat;
            filter: blur(12px);
            opacity: 0.7;
            z-index: -2;
        }

        .mini-overlay-wrapper::after {
            content: '';
            position: absolute;
            top: -20px; left: -20px; right: -20px; bottom: -20px;
            background: var(--brand-color, #00d2ff);
            mix-blend-mode: color;
            opacity: 0.7;
            z-index: -1;
            border-radius: inherit;
            pointer-events: none;
        }

        /* Scanline sutil imitando a outra barrinha */
        .mini-overlay-wrapper .scanline {
            position: absolute;
            top: 0; left: -100%; width: 20%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.15), transparent);
            animation: scanline-horizontal 5s linear infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes scanline-horizontal {
            0% { left: -100%; opacity: 0; }
            10% { opacity: 1; }
            50% { left: 200%; opacity: 0; }
            100% { left: 200%; opacity: 0; }
        }

        /* Container interno para o texto (onde aplicamos o scale matemático se precisar) */
        .content-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            white-space: nowrap;
            transition: transform 0.2s ease;
        }

        /* Nome da Arma */
        .weapon-name {
            font-family: 'Teko', sans-serif;
            font-size: 2.2rem;
            color: var(--neon-blue);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.9);
            margin-top: 4px;
        }

        /* Divisória vertical */
        .divider-vertical {
            width: 3px;
            height: 35px;
            background: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
            opacity: 0.7;
        }

        /* Valor do Código */
        .code-value {
            font-family: 'Teko', monospace;
            font-size: 2.2rem;
            color: #fff;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.9), 0 0 15px rgba(0, 210, 255, 0.4);
            margin-top: 4px;
        }

    </style>
</head>
<body>

    <div class="mini-overlay-wrapper" id="miniContainer">
        <div class="content-container" id="contentContainer">
            <div class="scanline"></div>
            <div class="weapon-name" id="weaponName">AGUARDE...</div>
            <div class="divider-vertical"></div>
            <div class="code-value" id="weaponCode">...</div>
        </div>
    </div>

    <script src="overlay_mini.js"></script>
</body>
</html>
